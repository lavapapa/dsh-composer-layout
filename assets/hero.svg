<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640" role="img" aria-labelledby="title desc">
  <title id="title">DSH Composer Layout</title>
  <desc id="desc">A DSH conversation beside a tall right-side Composer, illustrating reading and writing at the same time.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#0e1530"/><stop offset="1" stop-color="#252b62"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#758eff"/><stop offset="1" stop-color="#4f6bff"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="18" stdDeviation="20" flood-color="#050817" flood-opacity=".28"/></filter>
  </defs>
  <rect width="1280" height="640" rx="32" fill="url(#background)"/>
  <circle cx="1090" cy="56" r="180" fill="#5d73ff" opacity=".12"/><circle cx="1148" cy="565" r="220" fill="#7c5cff" opacity=".1"/>
  <g transform="translate(66 96)">
    <text x="0" y="0" fill="#c6d0ff" font-family="Arial, sans-serif" font-size="18" font-weight="700" letter-spacing="1.8">DSH COMPOSER LAYOUT</text>
    <text x="0" y="60" fill="#ffffff" font-family="Arial, sans-serif" font-size="46" font-weight="700">Keep the conversation</text>
    <text x="0" y="110" fill="#ffffff" font-family="Arial, sans-serif" font-size="46" font-weight="700">in view.</text>
    <text x="0" y="153" fill="#cbd4f3" font-family="Arial, sans-serif" font-size="22">Dock Composer right when you need to read and write at once.</text>
    <g transform="translate(0 209)">
      <circle cx="11" cy="0" r="5" fill="#91a4ff"/><text x="28" y="6" fill="#e9edff" font-family="Arial, sans-serif" font-size="18">A tall input space for long prompts and drafts</text>
      <circle cx="11" cy="42" r="5" fill="#91a4ff"/><text x="28" y="48" fill="#e9edff" font-family="Arial, sans-serif" font-size="18">Conversation context remains readable beside it</text>
      <circle cx="11" cy="84" r="5" fill="#91a4ff"/><text x="28" y="90" fill="#e9edff" font-family="Arial, sans-serif" font-size="18">Per-session layout and adjustable Composer width</text>
    </g>
  </g>
  <g transform="translate(735 82)" filter="url(#shadow)">
    <rect width="475" height="476" rx="22" fill="#f7f8fc"/>
    <circle cx="34" cy="32" r="6" fill="#ff6b6b"/><circle cx="55" cy="32" r="6" fill="#ffc857"/><circle cx="76" cy="32" r="6" fill="#4fd1a5"/>
    <rect x="24" y="65" width="292" height="382" rx="15" fill="#fff"/>
    <rect x="43" y="96" width="170" height="12" rx="6" fill="#c9d0df"/><rect x="43" y="124" width="231" height="10" rx="5" fill="#e3e7ee"/><rect x="43" y="148" width="196" height="10" rx="5" fill="#e3e7ee"/>
    <rect x="43" y="210" width="221" height="11" rx="5" fill="#d6ddeb"/><rect x="43" y="236" width="190" height="11" rx="5" fill="#e8ebf1"/>
    <rect x="332" y="65" width="119" height="382" rx="15" fill="#edf1ff" stroke="#aebdff" stroke-width="2"/>
    <rect x="344" y="283" width="95" height="142" rx="14" fill="#fff" stroke="#d8deef" stroke-width="2"/>
    <rect x="358" y="308" width="61" height="9" rx="4" fill="#c7cddc"/><rect x="358" y="329" width="51" height="8" rx="4" fill="#e1e5ee"/><rect x="358" y="350" width="59" height="8" rx="4" fill="#e1e5ee"/>
    <rect x="390" y="378" width="31" height="30" rx="10" fill="url(#accent)"/><path d="M405 386v14M398 393h14" stroke="#fff" stroke-width="2" stroke-linecap="round"/>
  </g>
  <rect x="66" y="538" width="250" height="46" rx="23" fill="url(#accent)"/>
  <text x="91" y="568" fill="#fff" font-family="Arial, sans-serif" font-size="18" font-weight="700">Bottom or right-side docking</text>
</svg>

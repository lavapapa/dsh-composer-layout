<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 350" role="img" aria-labelledby="title desc"><title id="title">自适应布局与空间折叠</title><desc id="desc">功能示意图，非界面截图。</desc><g font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif"><rect x="0" y="0" width="1200" height="350" rx="18" fill="#f7f9fd" stroke="none"/><text x="30" y="40" font-size="22" fill="#14213d" font-weight="650">01 / 布局跟随窗口</text><text x="30" y="73" font-size="14" fill="#677594" font-weight="400">够宽时并排；变窄时上下；宽度恢复后回到右侧。</text><text x="638" y="40" font-size="22" fill="#14213d" font-weight="650">02 / 控件随空间折叠</text><text x="638" y="73" font-size="14" fill="#677594" font-weight="400">第三方输入控件收进 …，需要时展开。</text><path d="M607 30v287" stroke="#dde4f0"/><rect x="30" y="105" width="280" height="175" rx="12" fill="#fff" stroke="#d2dbeb"/><rect x="42" y="117" width="150" height="150" rx="6" fill="#eef2f9" stroke="none"/><rect x="54" y="131" width="122" height="5" rx="2" fill="#dce2ee" stroke="none"/><rect x="54" y="146" width="104" height="5" rx="2" fill="#dce2ee" stroke="none"/><rect x="54" y="161" width="86" height="5" rx="2" fill="#dce2ee" stroke="none"/><rect x="54" y="176" width="122" height="5" rx="2" fill="#dce2ee" stroke="none"/><rect x="54" y="191" width="104" height="5" rx="2" fill="#dce2ee" stroke="none"/><rect x="54" y="206" width="86" height="5" rx="2" fill="#dce2ee" stroke="none"/><rect x="54" y="221" width="122" height="5" rx="2" fill="#dce2ee" stroke="none"/><rect x="54" y="236" width="104" height="5" rx="2" fill="#dce2ee" stroke="none"/><rect x="202" y="117" width="96" height="150" rx="6" fill="#eef1ff" stroke="none"/><rect x="212" y="131" width="73" height="5" rx="2" fill="#c1cef5" stroke="none"/><rect x="212" y="146" width="55" height="5" rx="2" fill="#c1cef5" stroke="none"/><rect x="212" y="161" width="37" height="5" rx="2" fill="#c1cef5" stroke="none"/><rect x="212" y="176" width="73" height="5" rx="2" fill="#c1cef5" stroke="none"/><rect x="212" y
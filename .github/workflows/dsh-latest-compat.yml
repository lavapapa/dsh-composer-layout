name: Check latest DSH compatibility

on:
  schedule:
    - cron: '17 3 * * 1'
  workflow_dispatch:
    inputs:
      dsh-version:
        description: DSH npm version or dist-tag to check
        required: false
        default: latest

permissions:
  contents: read

jobs:
  web-plugin:
    runs-on: ubuntu-latest
    env:
      DSH_VERSION: ${{ inputs.dsh-version || 'latest' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm exec playwright install --with-deps chromium
      - run: DSH_COMPAT_ARTIFACT_DIR=test-artifacts/dsh-latest-compat pnpm test:dsh-compat
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dsh-latest-compat-screenshots
          path: test-artifacts/dsh-latest-compat
          if-no-files-found: ignore

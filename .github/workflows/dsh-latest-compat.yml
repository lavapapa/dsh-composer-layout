name: Probe current DSH channels

on:
  schedule:
    - cron: '17 3 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  matrix:
    runs-on: ubuntu-latest
    outputs:
      pairs: ${{ steps.read.outputs.pairs }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - id: read
        shell: bash
        run: |
          node --input-type=module <<'JS' >> "$GITHUB_OUTPUT"
          import { readFileSync } from 'node:fs'
          const matrix = JSON.parse(readFileSync('scripts/dsh-compat-matrix.json', 'utf8'))
          const response = await fetch('https://registry.npmjs.org/@deepseek-ai%2fdsh')
          if (!response.ok) throw new Error(`npm registry returned ${response.status}`)
          const tags = (await response.json())['dist-tags']
          if (!tags.latest || !tags.alpha) throw new Error('DSH latest/alpha dist-tags are required')
          for (const row of matrix.include) {
            if (row.channel === 'stable') row.dsh = tags.latest
            if (row.channel === 'alpha') row.dsh = tags.alpha
          }
          console.log('pairs=' + JSON.stringify(matrix))
          JS

  web-plugin:
    needs: matrix
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.matrix.outputs.pairs) }}
    name: Probe ${{ matrix.channel }} plugin=${{ matrix.plugin }} DSH=${{ matrix.dsh }} ${{ matrix.browser }}
    env:
      DSH_VERSION: ${{ matrix.dsh }}
      DSH_BROWSER: ${{ matrix.browser }}
      DSH_COMPAT_PORT: 3815
      DSH_COMPAT_ARTIFACT_DIR: test-artifacts/dsh-channels
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
        if: matrix.plugin == 'working-tree'
      - run: pnpm exec playwright install --with-deps ${{ matrix.browser }}
      - run: node scripts/${{ matrix.script }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dsh-probe-${{ matrix.channel }}-${{ matrix.plugin }}-${{ matrix.dsh }}-${{ matrix.browser }}
          path: test-artifacts/dsh-channels
          if-no-files-found: ignore

name: Verify plugin package

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  matrix:
    runs-on: ubuntu-latest
    outputs:
      pairs: ${{ steps.read.outputs.pairs }}
    steps:
      - uses: actions/checkout@v4
      - id: read
        run: node -e "console.log('pairs=' + JSON.stringify(require('./scripts/dsh-compat-matrix.json')))" >> "$GITHUB_OUTPUT"

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm build
      - run: pnpm test

  dsh-compatibility:
    needs: matrix
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.matrix.outputs.pairs) }}
    name: ${{ matrix.channel }} plugin=${{ matrix.plugin }} DSH=${{ matrix.dsh }} ${{ matrix.browser }}
    env:
      DSH_VERSION: ${{ matrix.dsh }}
      DSH_BROWSER: ${{ matrix.browser }}
      DSH_COMPAT_PORT: 3815
      DSH_COMPAT_ARTIFACT_DIR: test-artifacts/dsh-compat
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
        if: matrix.plugin == 'working-tree'
      - run: pnpm exec playwright install --with-deps ${{ matrix.browser }}
      - run: node scripts/${{ matrix.script }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dsh-compat-${{ matrix.channel }}-${{ matrix.plugin }}-${{ matrix.dsh }}-${{ matrix.browser }}
          path: test-artifacts/dsh-compat
          if-no-files-found: ignore

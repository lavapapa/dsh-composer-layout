name: Verify plugin package

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm build
      - run: pnpm test

  dsh-compatibility:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm exec playwright install --with-deps chromium
      - run: DSH_COMPAT_ARTIFACT_DIR=test-artifacts/dsh-compat pnpm test:dsh-compat
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dsh-compat-screenshots
          path: test-artifacts/dsh-compat
          if-no-files-found: ignore
